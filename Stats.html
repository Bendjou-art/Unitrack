<!DOCTYPE html>
<html>
<head>
    <title>Statistiques</title>
</head>
<body>

<h1>Statistiques</h1>

<p>Moyenne : {{ moyenne }}</p>

<canvas id="chart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const data = {
    labels: {{ notes|tojson }},
    datasets: [{
        label: 'Notes',
        data: {{ notes|tojson }},
    }]
};

new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: data
});
</script>

</body>
</html>
