{% extends 'base.html' %}
{% block content %}

<a href="/add_student" class="btn btn-primary mb-3">Ajouter étudiant</a>

{% for s in students %}
<div class="card p-3 mb-2">
<b>{{s.nom}} {{s.prenom}}</b>

<a href="/add_notes/{{s.id}}">Notes</a>
<a href="/add_schedule/{{s.id}}">Emploi</a>
<a href="/add_transaction/{{s.id}}">Transaction</a>
<a href="/planning/{{s.id}}">Planning</a>
<a href="/stats/{{s.id}}">Stats</a>

</div>
{% endfor %}

{% endblock %}
